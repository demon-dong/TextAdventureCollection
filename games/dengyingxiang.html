<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>灯影巷 · 消失的走马灯</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');

        body{
            background: #0d1117;
            /* 暗底上铺一层极淡的水墨纹理感 */
            background-image:
                    radial-gradient(ellipse at 20% 80%, rgba(120,60,20,.12) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 20%, rgba(180,100,30,.08) 0%, transparent 50%);
            color: #ddd8ce;
            font-family: "Noto Serif SC","PingFang SC","Microsoft YaHei",serif;
            min-height:100vh;
            display:flex; justify-content:center; align-items:flex-start;
            padding:20px 12px 60px;
            -webkit-tap-highlight-color:transparent;
        }
        @media(max-width:440px){body{padding:10px 6px 48px;}}

        #game{
            width:100%; max-width:640px;
            background: linear-gradient(175deg,#14100e 0%,#1a1410 50%,#110e0c 100%);
            border:1px solid #2a2118;
            border-radius:16px;
            box-shadow:
                    0 0 80px rgba(180,100,30,.06),
                    inset 0 1px 0 rgba(255,200,120,.04);
            overflow:hidden; position:relative;
        }

        /* ===== 顶部 ===== */
        #header{
            background:linear-gradient(90deg,#1c1610,#17120d);
            border-bottom:1px solid #2a2118;
            padding:13px 18px;
            display:flex;align-items:center;gap:10px;
        }
        #header .lantern{
            width:34px;height:34px;border-radius:10px;
            background:radial-gradient(circle,#e8653a 0%,#9b2c14 70%,#5c1508 100%);
            box-shadow:0 0 12px rgba(232,101,58,.35);
            display:flex;align-items:center;justify-content:center;
            font-size:18px;flex-shrink:0;
            position:relative;
        }
        #header .lantern::after{
            content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
            width:2px;height:6px;background:#5c3a1e;border-radius:0 0 1px 1px;
        }
        #header .title{font-size:15px;font-weight:700;color:#e8c87a;letter-spacing:1.5px;}
        #header .sub{font-size:10.5px;color:#7a6850;margin-top:1px;letter-spacing:.5px;}

        /* ===== 场景区 ===== */
        #scene-area{padding:20px 18px 8px;min-height:200px;}
        @media(max-width:440px){#scene-area{padding:16px 12px 6px;min-height:170px;}}

        .scene-icon{font-size:42px;margin-bottom:8px;
            filter:drop-shadow(0 0 14px rgba(232,160,60,.2));}

        #scene-text{
            font-size:15px;line-height:1.9;color:#c9bda0;
            letter-spacing:.3px;white-space:pre-line;
            min-height:50px;word-break:break-word;
        }
        #scene-text .cursor{
            display:inline-block;width:7px;height:17px;
            background:#d4a24e;margin-left:2px;
            animation:blink .65s steps(1) infinite;vertical-align:text-bottom;
        }
        @keyframes blink{50%{opacity:0}}

        .divider{border:none;border-top:1px solid #231e16;margin:12px 0 4px;}

        /* ===== 选项 ===== */
        #choices{padding:6px 18px 20px;display:flex;flex-direction:column;gap:9px;transition: opacity .25s ease;}
        @media(max-width:440px){#choices{padding:6px 12px 18px;gap:8px;}}

        .choice-btn{
            display:block;width:100%;text-align:left;
            background:linear-gradient(135deg,#1a1510 0%,#16120c 100%);
            border:1px solid #2e2618;
            border-radius:11px;padding:13px 16px;
            color:#d8c8a8;font-size:14.5px;line-height:1.6;
            font-family:inherit;cursor:pointer;
            -webkit-tap-highlight-color:transparent;
            position:relative;user-select:none;
            transition:background .18s,border-color .18s,transform .16s,box-shadow .18s;
        }
        @media(max-width:440px){.choice-btn{padding:12px 13px;font-size:13.5px;border-radius:9px;}}
        .choice-btn .badge{
            display:inline-block;margin-right:6px;
            color:#e8a040;font-size:13px;opacity:.7;
        }
        .choice-btn .arr{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.25;font-size:12px;color:#e8c050;}
        .choice-btn.disabled {
            opacity: 0.45;
            pointer-events: none;
        }

        .choice-btn:active{transform:translateX(2px) scale(.975);
            background:linear-gradient(135deg,#221c12,#1a1510);border-color:#a06828;}
        @media(hover:hover)and(pointer:fine){
            .choice-btn:hover{
                background:linear-gradient(135deg,#221c12,#1a1510);
                border-color:#c08030;color:#f0e4cc;
                box-shadow:0 0 18px rgba(200,130,40,.08);transform:translateX(3px);
            }
            .choice-btn:active{transform:translateX(3px)scale(.975);}
        }

        /* ===== 状态栏 ===== */
        #statusbar{
            display:flex;gap:12px;flex-wrap:wrap;
            padding:9px 18px 13px;
            font-size:11px;color:#5c4e3a;
            border-top:1px solid #1e1810;
            background:rgba(0,0,0,.15);
        }
        @media(max-width:440px){#statusbar{padding:8px 12px 11px;gap:8px;font-size:10.5px;}}
        #statusbar b{color:#c0a060;font-weight:600;}

        /* 淡入动画 */
        @keyframes fadeSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        .shake{animation:shake .35s ease}
        @keyframes shake{
            0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)}
            40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)}
        }

        /* 顶部的"章节标记" */
        .chap-tag{
            display:inline-block;
            font-size:10px;letter-spacing:2px;color:#a06828;
            border:1px solid #3a2a16;background:rgba(160,100,30,.06);
            padding:2px 8px;border-radius:4px;margin-bottom:6px;
            font-family:"PingFang SC","Microsoft YaHei",sans-serif;
        }

        /* 道具获得闪金 */
        .item-pop{
            display:inline-block;
            color:#f0d060;font-weight:700;
            text-shadow:0 0 8px rgba(240,208,96,.4);
        }
    </style>
</head>
<body>

<div id="game">
    <!-- 顶栏 -->
    <div id="header">
        <div class="lantern">🏮</div>
        <div>
            <div class="title">灯影巷</div>
            <div class="sub">· 消失的走马灯</div>
        </div>
    </div>

    <!-- 场景 -->
    <div id="scene-area">
        <div class="scene-icon" id="scene-icon"></div>
        <div id="scene-text"></div>
    </div>
    <hr class="divider">
    <div id="choices"></div>

    <!-- 状态 -->
    <div id="statusbar">
        <span>🕒 <b id="st-time">腊月廿七 傍晚</b></span>
        <span>🎒 道具：<b id="st-inv">无</b></span>
        <span>📖 线索 <b id="st-pages">0 / 6</b></span>
        <a href="../index.html" style="color:#e8c87a;font-size:13px;opacity:.7;text-decoration:none">← 返回合集</a>
    </div>
</div>

<script>
    /* ==========================================================
       ★ 状态
       ========================================================== */
    const state = {
        inv: [],          // 道具
        flags: {},        // 各种开关
        pages: 0,         // 收集的册子页数/线索数 0-6
        shenWarm: 0,      // 沈爷爷好感 0-3
        timeLabel: '腊月廿七 傍晚',
    };

    function addInv(item){
        if(!state.inv.includes(item)) state.inv.push(item);
    }
    function hasInv(item){ return state.inv.includes(item); }
    function setFlag(k,v){ state.flags[k]=v; }
    function getFlag(k){ return !!state.flags[k]; }

    function updateStatus(){
        document.getElementById('st-inv').textContent = state.inv.length ? state.inv.join('、') : '无';
        document.getElementById('st-pages').textContent = state.pages + ' / 6';
        document.getElementById('st-time').textContent = state.timeLabel;
    }

    /* ==========================================================
       ★ 场景数据
       id : { icon, text, choices:[{label,goto,action}] }
       ========================================================== */
    const SCENES = {};

    function S(id, icon, text, choices){
        SCENES[id] = { icon, text, choices };
    }

    /* ─────────────── 序章 ─────────────── */
    S('start', '🏮',
        `腊月廿七。枕水镇的冬天不冷，但风里有水腥味。

你被爸妈"寄存"在外婆的豆腐坊已经第七天了——他们说"寒假最后一周，跟外婆待完啊"，然后小汽车嘟嘟开出青石板路，副驾飘落的那张纸角你隐约看到几个字：「灯巷片区 · 改造开发意向书」……

外婆系着蓝印花布围裙，正拿大铜勺搅豆浆。蒸腾白雾把她脸烘得柔和。她像随口说：

"灯巷那边别去啊。今年元宵不办灯会了。那帮老灯匠关了铺子窝着不出来，邪门得很。尤其沈老头那『沈记灯坊』——他门锁着，钥匙不给任何人。"

她顿了顿，往巷子方向瞥一眼。

"你要是碰见他……替我捎句：『豆浆还欠你一碗。』"

她转身。你注意到：
 ① 她腰侧抽屉里露出一角旧照片——一群人举走马灯站在石桥上
 ② 窗台上扣着空芝麻糖纸。外婆不吃芝麻糖……
 ③ 门外石板路"笃、笃"——佝偻老头拎竹篮走过，篮底漏出一线极淡的金红色光。`,

        [
            { label:'🔍 趁外婆搅豆浆，悄悄翻抽屉看那张照片', goto:'start_peek' },
            { label:'🍬 抓俩芝麻糖揣兜，直接溜出门往灯巷走',    goto:'lamp_alley' },
            { label:'🥛 先帮外婆滤豆渣、擦碗——她高兴了也许多说点',goto:'start_help' },
            { label:'🏃 追出去看那个老头（沈爷爷？）',             goto:'lamp_alley_chase' },
        ]);

    /* ——— 翻抽屉 ——— */
    S('start_peek','📸',
        `你踮脚拉开抽屉——

外婆的围裙"啪"一声盖住半边台面。她没生气，只是叹了口气，把托盘搁下来。

"跟你妈一模一样。她也翻我抽屉。"

她自己把照片抽出来——泛黄的四寸照，一群穿棉袄的人站在拱桥上，最高那盏灯画着一条绕云龙，鳞片是一层层染色绢纸贴出来的。

"这灯叫『吞云』。你外公帮沈老头他爹画的灯面。"她拇指蹭桥面。
"后来……灯谱丢了。册子不见了。沈老头说灯骨还在，可没图样，灯魂就回不来。"

她从灶台砖缝抠出一把小铜钥匙，搁你手心：

"灯坊后院柴棚。他藏了半辈子不用的旧工具。你去看看——别说我从哪拿的钥匙。"

> 🎒 获得：【柴棚小铜钥匙】
> 🎒 获得：【外婆的默许】（沈爷爷认这个名字）

外婆用勺敲你脑门："看完了？去吧。天黑前回来吃豆腐圆子。"`,
        [
            { label:'✊ 攥紧钥匙，出门往灯巷走', goto:'lamp_alley', action:()=>{
                    addInv('柴棚小铜钥匙'); setFlag('grandmaOk',true);
                }},
        ]);

    /* ——— 帮干活 ——— */
    S('start_help','🥢',
        `你老老实实干了半小时：滤豆渣、浇卤、擦碗、给熟客装袋。

外婆最后把最后一勺红糖豆浆倒你碗里：

"行吧。比那帮穿西装的『规划师』勤劳。"
"跟你说实话：灯巷不是邪——是有人偷了东西。
  沈老头那本蓝布封册子——灯面画稿、竹篾尺寸、颜料配方——一夜没了。
  他不说，但我知道：那贼坐船从后窗河面摸进去的。"

"你要闲得慌……帮我把一包豆腐干送去枕河居，给茶阿婆。
  她嘴碎，但碎的都是有用的。"

> 🎒 获得：【送给茶阿婆的豆腐干】
> 💡 情报：蓝布册子丢了，从河面后窗进的`,
        [
            { label:'📦 拎豆腐干先去茶馆摸情报', goto:'teahouse_entry', action:()=>{
                    addInv('送给茶阿婆的豆腐干'); setFlag('knowBookMissing',true);
                }},
            { label:'🏮 先拐去灯巷看沈记灯坊', goto:'lamp_alley' },
        ]);

    /* ——— 直接出门/追沈爷爷 ——— */
    S('lamp_alley_chase','👴',
        `你追出去——石板路拐角空了。只有竹篮落下的几根细篾片。

篮底那缕金红……走近才发现是<strong>一小片染色绢纸</strong>，松烟墨画的龙鳞局部。你捡起来，揣兜。

再往前走，灯巷到了。`,
        [
            { label:'🏮 走进灯巷找沈记灯坊', goto:'lamp_alley', action:()=>addInv('龙鳞绢片') },
        ]);
    S('lamp_alley','🏮',
        `灯巷比外婆说的还安静。七家灯铺：朱漆木门全钉了木板。只有最尽头——

<strong>「沈记灯坊」</strong>

门板没钉死，但一把拳头大的老铜锁挂着，锁上缠了圈褪色红绳。门缝渗出的不是霉味——是<strong>竹篾烤焦香</strong>和<strong>松烟墨</strong>。

你蹲下看锁眼——

"看什么呢。"

抬头。沈爷爷不知何时站台阶上，竹篮搁一边。他眼睛像泡了几百年水的河卵石。不凶，就是……很深。

"你外婆的豆浆我喝过了。"他把篮放下，"她人呢？"

> 选怎么说——`,
        [
            { label:'💬 "我就是来看看灯！外婆说今年不办灯会了，为啥？"', goto:'shen_cold' },
            { label:'🍬 掏芝麻糖递过去："外婆说欠您一碗豆腐脑。这个抵行不？"', goto:'shen_warm' },
            { label:'🙂 不说话，伸手轻轻碰一下那根缠锁的红绳', goto:'shen_string' },
        ]);

    /* ——— 沈爷爷分支 ——— */
    S('shen_cold','🧓',
        `沈爷爷哼一声，手指摩挲铜锁：

"灯都没了，办什么灯会。"

他拎起篮要走——

"……你要逛也行。别碰二楼楼梯口那块活板。底下养东西。"

（他没说"不许进"，只是"别碰"。这算……默许？）

你看看左右——灯巷往回走是豆腐坊方向，往前走到底通河边台阶，右手有条窄缝夹道通后院柴棚。`,
        [
            { label:'🔙 先去枕河居茶馆（路过外婆那顺路拿豆腐干也行）', goto:'teahouse_entry' },
            { label:'🚪 试试后院夹道→柴棚（有钥匙吗？）', goto:'backyard', action:()=>setFlag('shenColdMet',true) },
        ]);

    S('shen_warm','🍬',
        `沈爷爷低头看你掌心那颗芝麻糖。停两秒——接过去，剥开，咬半口。

嚼的时候眉心那道竖纹松了一毫米。

"……糖还行。"他把糖纸折好塞进自己袖袋，"进来。只准在楼下。"

铜锁喀嗒——他开门。门轴呻吟像老猫伸懒腰。

灯坊一楼像个<strong>竹骨动物园</strong>：半成品灯架靠墙立着，最大那个空圆台积灰——旁边矮凳上摊着刀、尺、鱼鳔胶罐、一束发黄的苏州绢。

"柴棚在后院。你外婆给你钥匙了？"

> 🤝 沈爷爷态度：【松动】（好感+1）`,
        [
            { label:'🚪 进一楼随便看看（可调查物件）', goto:'workshop_ground', action:()=>{ state.shenWarm=1; addInv('沈爷爷的默许'); }},
            { label:'🏃 后院柴棚先（如果有钥匙）', goto:'backyard' },
            { label:'🍵 先去茶馆送豆腐干，回来再仔细搜', goto:'teahouse_entry' },
        ]);

    S('shen_string','🔴',
        `指尖刚碰到红绳——

"！"沈爷爷猛地拍你手腕。力气大得惊人。

不是真疼。但红绳上那根细铜丝震了一下……绳结里嵌着一粒<strong>淡蓝色碎晶</strong>，像呼吸般明灭一次。

他看你掌心（没有伤，但你的体温让碎晶光更亮了），表情变了：

"……你手上有茧。谁教你编竹的？"

"……先不编。你叫什么。"

> 💡 【神秘值+1】——碎晶记住你了。`,
        [
            { label:'🏮 趁他愣神，问能不能进灯坊', goto:'workshop_ground', action:()=>{
                    state.shenWarm=1; setFlag('stringTouched',true); addInv('碎晶（淡蓝）');
                }},
            { label:'🚶 退一步，先去茶馆打听', goto:'teahouse_entry' },
        ]);

    /* ——— 灯坊一楼可调查 ——— */
    S('workshop_ground','🛠️',
        `灯坊一楼光线像蜂蜜——夕阳从窄高窗斜切进来。

你可以调查：

  📦 <strong>矮凳工作台</strong>：刀尺胶罐，鱼鳔胶罐底结了一层琥珀色硬壳。旁边一叠作废灯屏草稿，背面用炭笔写了些数字……像尺寸验算。
  🪣 <strong>角落水缸</strong>：水面沉着几片金箔碎屑。
  🚪 <strong>后门（通柴棚）</strong>：木闩插着。要是你有外婆的钥匙……

沈爷爷在里间敲什么，没管你。`,
        [
            { label:'📏 翻草稿纸——背面数字像灯骨尺寸！抄下来', goto:'found_notes', action:()=>{
                    addInv('灯骨尺寸草稿'); state.pages+=1;
                }},
            { label:'🚪 开后门去柴棚（需要柴棚钥匙）', goto: getFlag('grandmaOk')||hasInv('柴棚小铜钥匙') ? 'backyard' : 'backyard_locked' },
            { label:'🍵 去茶馆找茶阿婆', goto:'teahouse_entry' },
        ]);

    S('found_notes','📏',
        `你小心揭那张草稿纸——背面确实是灯骨编法：六方柱体，每棱竹篾粗细、弧度、搭接角度写得像工程图。

翻过来正面，炭笔画了一条龙尾——只画到一半就停了。纸角印着褪色蓝布纤维：<strong>这说明它就是从那本蓝布册子上撕下来的页！</strong>

你听见里间沈爷爷的脚步——赶紧把纸折好塞内袋。

> 📖 线索 +1（灯骨尺寸草稿）
> 🎒 获得：【灯骨尺寸草稿】`,
        [
            { label:'🍵 好，现在真的该去茶馆了', goto:'teahouse_entry' },
            { label:'🚪 后院柴棚', goto:'backyard' },
        ]);

    /* ——— 后院柴棚 ——— */
    S('backyard_locked','🔒',
        `门闩插着。铜锁扣着。你掏掏兜——没有钥匙。

从木板缝往里看：昏暗中堆着旧竹篾捆、一截铁炉烟囱、翻过来的木桶……和一个<strong>半遮的蓝布角</strong>。

沈爷爷声音从背后来：

"钥匙在你外婆那。"

> 看来得先搞定外婆的关系线。`,
        [
            { label:'🍵 行，先去茶馆', goto:'teahouse_entry' },
            { label:'🏮 回去再磨沈爷爷开门', goto:'lamp_alley' },
        ]);

    S('backyard','🌿',

    /* ==========================================================
       ★ 渲染引擎（无需改动）
       ========================================================== */
    let currentId = 'start';
    let isTyping = false;

    function $(id){ return document.getElementById(id); }

    function renderScene(id){
        const sc = SCENES[id];
        if(!sc) return;
        currentId = id;

        $('choices').innerHTML = '';
        document.querySelectorAll('.choice-btn').forEach(b=>b.classList.add('disabled'));
        $('choices').style.opacity = '0';
        setTimeout(()=>{
            $('choices').innerHTML = '';
            $('choices').style.opacity = '1';
        }, 250);

        $('scene-icon').textContent = sc.icon;

        // 打字机效果
        let i = 0, txt = sc.text;
        $('scene-text').innerHTML = '';
        isTyping = true;

        const cursor = '<span class="cursor"></span>';
        $('scene-text').innerHTML = cursor;

        const timer = setInterval(()=>{
            if(i<txt.length){
                $('scene-text').innerHTML = txt.slice(0,i+1) + cursor;
                i++;
            } else {
                clearInterval(timer);
                isTyping = false;
                $('scene-text').innerHTML = txt;
                renderChoices(sc.choices);
            }
        }, 32);

        updateStatus();
    }

    function renderChoices(choices){
        const cEl = $('choices');
        cEl.innerHTML = '';

        // 过滤条件选项
        const valid = choices.filter(ch => {
            if(ch.condition) return ch.condition();
            if(ch.default) return true;
            return true;
        });

        valid.forEach((ch,i)=>{
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerHTML = `<span class="badge">${String.fromCharCode(9312+i)}</span>${ch.label}<span class="arr">›</span>`;
            btn.onclick = () => {
                if(isTyping) return;
                if(ch.action) ch.action();
                renderScene(ch.goto);
            };
            cEl.appendChild(btn);
        });
    }

    // 初始化
    renderScene('start');
    updateStatus();
</script>
